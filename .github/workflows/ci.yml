name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  seo-release-gate:
    name: SEO corpus release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
      - name: Checkout SEO Skill corpus
        uses: actions/checkout@v4
        with:
          repository: uvwt/agentdock-skills
          ref: 174b190a83789f085488f9e56d0c2b9e3ef7cbe8
          path: .release-gate/agentdock-skills
          persist-credentials: false
      - name: Verify SEO corpus is published
        shell: bash
        run: |
          set -euo pipefail
          root=".release-gate/agentdock-skills/skills"
          test -f "$root/seo/SKILL.md" || { echo "::error::SEO corpus is missing from uvwt/agentdock-skills; publish P1.3 Skill corpus before releasing Core."; exit 1; }
          while IFS= read -r skill; do
            test -f "$root/$skill/SKILL.md" || { echo "::error::Missing required SEO Skill: $skill"; exit 1; }
          done < packaging/seo-release-corpus.txt
          count="$(find "$root" -mindepth 2 -maxdepth 2 -name SKILL.md | grep -E '/seo(-[^/]*)?/SKILL.md$' | wc -l)"
          expected="$(wc -l < packaging/seo-release-corpus.txt)"
          if [ "$count" -ne "$expected" ]; then
            echo "::error::SEO corpus drift: found $count packages, expected $expected; update reviewed corpus manifest."
            exit 1
          fi
          echo "Verified SEO corpus packages: $count"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Enforce SEO release gate with full corpus
        env:
          AGENTDOCK_SEO_SKILLS_ROOT: ${{ github.workspace }}/.release-gate/agentdock-skills/skills
        run: go test ./internal/skill -run '^Test(SEOReleaseGate|ValidateReportsSEOReleaseGateIssues|InstallCannotBypassSEOReleaseGate|ActivateRechecksSEOReleaseGate)' -count=1 -v
  go:
    name: Go check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        shell: bash
        run: |
          unformatted="$(git ls-files '*.go' | while IFS= read -r file; do gofmt -l "$file"; done)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Check Windows test tree cleanliness
        if: runner.os == 'Windows'
        shell: bash
        run: |
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf 'Unexpected files created by tests:\n%s\n' "$untracked"
            exit 1
          fi

      - name: Race
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/agentdock

      - name: Check Linux scripts
        if: runner.os == 'Linux'
        run: make test-scripts

      - name: Test macOS scripts
        if: runner.os == 'macOS'
        run: make test-scripts-macos

      - name: Check Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-install-windows.ps1

      - name: Test Windows PowerShell DPAPI round trip
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Security

          $plainText = 'agentdock-dpapi-roundtrip'
          $entropy = [Text.Encoding]::UTF8.GetBytes('agentdock.startup.v1')
          $protectedBytes = [System.Security.Cryptography.ProtectedData]::Protect(
            [Text.Encoding]::UTF8.GetBytes($plainText),
            $entropy,
            [System.Security.Cryptography.DataProtectionScope]::CurrentUser
          )
          $unprotectedBytes = [System.Security.Cryptography.ProtectedData]::Unprotect(
            $protectedBytes,
            $entropy,
            [System.Security.Cryptography.DataProtectionScope]::CurrentUser
          )
          $actual = [Text.Encoding]::UTF8.GetString($unprotectedBytes)

          if ($actual -ne $plainText) {
            throw "DPAPI round trip mismatch. Expected '$plainText', got '$actual'."
          }


  browser-integration:
    name: Native browser integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Browser integration race
        shell: bash
        run: |
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$browser_path"
          xvfb-run -a env AGENTDOCK_BROWSER_EXECUTABLE_PATH="$browser_path" go test -race -tags browser_integration ./internal/tool/browser ./internal/app -count=1


  container:
    name: Container check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify images
        run: ./scripts/test/test-docker-images.sh
